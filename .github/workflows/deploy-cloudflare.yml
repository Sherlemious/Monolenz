name: Deploy to Cloudflare

# main  -> migrate Neon production branch, then deploy the Worker (serves 100% of traffic)
# stage -> upload a new Worker version with a preview URL (does not take production traffic)
on:
  push:
    branches: [main, stage]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.14.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @monolenz/types --filter @monolenz/resume-pdf build

      # Only production runs migrations; they go over the direct (non-pooler) Neon URL.
      - name: Apply database migrations
        if: github.ref == 'refs/heads/main'
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm prisma migrate deploy

      # NEXT_PUBLIC_* are inlined at build time. Runtime secrets (AUTH_SECRET, …) live on
      # the Worker (`wrangler secret put`), never in env files (they would be bundled).
      - name: Build and deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          # OpenNext's deploy starts wrangler's local binding proxy, which requires a value; never used remotely.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://placeholder@localhost:5432/unused
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            pnpm run deploy
          else
            pnpm run upload
          fi
