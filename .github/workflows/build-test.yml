name: Build and Test

permissions:
    contents: read
    pull-requests: read

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev]
    workflow_dispatch:

env:
    NODE_VERSION: "20"
    PNPM_VERSION: "10.14.0"

jobs:
    # Always build everything for now - simpler and more reliable
    setup:
        name: Setup Environment
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      pnpm-store-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      apps/*/node_modules
                      packages/*/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

    lint:
        name: Lint Code
        runs-on: ubuntu-latest
        needs: [setup]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Restore node_modules cache
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      apps/*/node_modules
                      packages/*/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install dependencies (if cache miss)
              run: pnpm install --frozen-lockfile

            - name: Run linting
              run: pnpm lint

    type-check:
        name: Type Check
        runs-on: ubuntu-latest
        needs: [setup]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Restore node_modules cache
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      apps/*/node_modules
                      packages/*/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install dependencies (if cache miss)
              run: pnpm install --frozen-lockfile

            - name: Run type checking
              run: pnpm check-types

    build:
        name: Build Applications
        runs-on: ubuntu-latest
        needs: [setup]
        strategy:
            matrix:
                app: [api, web]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Restore node_modules cache
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      apps/*/node_modules
                      packages/*/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install dependencies (if cache miss)
              run: pnpm install --frozen-lockfile

            - name: Build packages first
              run: pnpm --filter="@monolenz/*" build

            - name: Build ${{ matrix.app }}
              run: pnpm --filter=${{ matrix.app }} build

            - name: Cache build artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      apps/${{ matrix.app }}/dist
                      apps/${{ matrix.app }}/.next
                      packages/*/dist
                  key: build-${{ matrix.app }}-${{ runner.os }}-${{ github.sha }}

    test:
        name: Run Tests
        runs-on: ubuntu-latest
        needs: [setup]
        strategy:
            matrix:
                app: [api, web]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Restore node_modules cache
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      apps/*/node_modules
                      packages/*/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install dependencies (if cache miss)
              run: pnpm install --frozen-lockfile

            - name: Run tests for ${{ matrix.app }}
              run: |
                  if pnpm --filter=${{ matrix.app }} run test --if-present; then
                    echo "Tests passed for ${{ matrix.app }}"
                  else
                    echo "No tests found for ${{ matrix.app }}, skipping..."
                  fi

    docker-build:
        name: Test Docker Build
        runs-on: ubuntu-latest
        needs: [build]
        strategy:
            matrix:
                include:
                    - app: api
                      dockerfile: Dockerfile.api
                    - app: web
                      dockerfile: Dockerfile.web
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Test Docker build for ${{ matrix.app }}
              run: |
                  docker build \
                    --target production \
                    --tag monolenz-${{ matrix.app }}:test \
                    -f ${{ matrix.dockerfile }} \
                    .

            - name: Test Docker container starts
              run: |
                  # Start container in background
                  docker run -d --name test-${{ matrix.app }} \
                    -p 3000:3000 \
                    monolenz-${{ matrix.app }}:test || \
                  docker run -d --name test-${{ matrix.app }} \
                    -p 3001:3001 \
                    monolenz-${{ matrix.app }}:test

                  # Wait a few seconds for container to start
                  sleep 10

                  # Check if container is still running
                  if docker ps | grep -q test-${{ matrix.app }}; then
                    echo "✅ Docker container for ${{ matrix.app }} started successfully"
                    docker stop test-${{ matrix.app }}
                  else
                    echo "❌ Docker container for ${{ matrix.app }} failed to start"
                    docker logs test-${{ matrix.app }}
                    exit 1
                  fi

    summary:
        name: Build Summary
        runs-on: ubuntu-latest
        needs: [lint, type-check, build, test, docker-build]
        if: always()
        steps:
            - name: Check results
              run: |
                  echo "🔍 Build Summary:"
                  echo "================="

                  if [ "${{ needs.lint.result }}" = "success" ]; then
                    echo "✅ Linting: PASSED"
                  else
                    echo "❌ Linting: FAILED"
                  fi

                  if [ "${{ needs.type-check.result }}" = "success" ]; then
                    echo "✅ Type Check: PASSED"
                  else
                    echo "❌ Type Check: FAILED"
                  fi

                  if [ "${{ needs.build.result }}" = "success" ]; then
                    echo "✅ Build: PASSED"
                  else
                    echo "❌ Build: FAILED"
                  fi

                  if [ "${{ needs.test.result }}" = "success" ] || [ "${{ needs.test.result }}" = "skipped" ]; then
                    echo "✅ Tests: PASSED"
                  else
                    echo "❌ Tests: FAILED"
                  fi

                  if [ "${{ needs.docker-build.result }}" = "success" ] || [ "${{ needs.docker-build.result }}" = "skipped" ]; then
                    echo "✅ Docker Build: PASSED"
                  else
                    echo "❌ Docker Build: FAILED"
                  fi

                  # Check if any critical jobs failed
                  if [ "${{ needs.lint.result }}" = "failure" ] || \
                     [ "${{ needs.type-check.result }}" = "failure" ] || \
                     [ "${{ needs.build.result }}" = "failure" ] || \
                     [ "${{ needs.docker-build.result }}" = "failure" ]; then
                    echo ""
                    echo "❌ Build failed! Please fix the issues above."
                    exit 1
                  else
                    echo ""
                    echo "🎉 All checks passed! Ready to merge."
                  fi
