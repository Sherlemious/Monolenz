name: Test Docker Build (Manual)

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to test'
        required: true
        type: choice
        options:
          - web
          - api

jobs:
  test-docker-build:
    name: Test Docker Build - ${{ inputs.app }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --target runner \
            --tag monolenz-${{ inputs.app }}:test \
            -f Dockerfile.${{ inputs.app }} .

      - name: Test Docker container starts
        run: |
          # Start container in background
          docker run -d --name test-${{ inputs.app }} \
            -p 3000:3000 \
            monolenz-${{ inputs.app }}:test || \
          docker run -d --name test-${{ inputs.app }} \
            -p 3001:3001 \
            monolenz-${{ inputs.app }}:test

          # Wait a few seconds for container to start
          sleep 10

          # Check if container is still running
          if docker ps | grep -q test-${{ inputs.app }}; then
            echo "✅ Docker container for ${{ inputs.app }} started successfully"
            docker stop test-${{ inputs.app }}
          else
            echo "❌ Docker container for ${{ inputs.app }} failed to start"
            docker logs test-${{ inputs.app }}
            exit 1
          fi
