name: Deploy to Staging

on:
  push:
    branches: [stage]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY: us-central1-docker.pkg.dev
  REGION: us-central1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
      api: ${{ steps.changes.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.14.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: |
          # Build shared packages first
          pnpm --filter="@monolenz/*" build
          # Build API without database
          pnpm --filter=api build:without-db
          # Build web normally
          pnpm --filter=web build

      - name: Test (if tests exist)
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            pnpm test
          else
            echo "No tests found, skipping..."
          fi

  deploy-web:
    needs: [changes, build-and-test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Web Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }} \
            --build-arg NEXT_PUBLIC_API_URL=https://monolenz-api-staging-${{ secrets.GCP_SERVICE_SUFFIX }}.a.run.app \
            -t $REGISTRY/$PROJECT_ID/monolenz-web-staging:$GITHUB_SHA \
            -f Dockerfile.web .

      - name: Push Web Docker image
        run: docker push $REGISTRY/$PROJECT_ID/monolenz-web-staging:$GITHUB_SHA

      - name: Deploy Web to Cloud Run (0% traffic)
        run: |
          gcloud run deploy monolenz-web-staging \
            --image $REGISTRY/$PROJECT_ID/monolenz-web-staging:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --no-traffic \
            --tag candidate-$GITHUB_SHA \
            --set-env-vars="NODE_ENV=staging"

      - name: Get candidate URL
        id: get-url
        run: |
          CANDIDATE_URL=$(gcloud run services describe monolenz-web-staging \
            --platform managed \
            --region $REGION \
            --format 'value(status.traffic[0].url)' \
            --filter="status.traffic.tag=candidate-$GITHUB_SHA")
          echo "candidate_url=$CANDIDATE_URL" >> $GITHUB_OUTPUT

      - name: Health check Web
        run: |
          echo "Testing candidate deployment: ${{ steps.get-url.outputs.candidate_url }}"
          for i in {1..30}; do
            if curl -f "${{ steps.get-url.outputs.candidate_url }}/health" 2>/dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "Health check failed after 5 minutes"
          exit 1

      - name: Switch traffic to new revision
        run: |
          gcloud run services update-traffic monolenz-web-staging \
            --platform managed \
            --region $REGION \
            --to-tags candidate-$GITHUB_SHA=100

      - name: Clean up old revisions
        run: |
          # Keep only the latest 2 revisions for staging
          gcloud run revisions list \
            --service monolenz-web-staging \
            --platform managed \
            --region $REGION \
            --filter="NOT traffic.percent:0" \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)" \
            --limit=10 | tail -n +3 | while read revision; do
              if [ ! -z "$revision" ]; then
                echo "Deleting old revision: $revision"
                gcloud run revisions delete $revision \
                  --platform managed \
                  --region $REGION \
                  --quiet
              fi
            done

  deploy-api:
    needs: [changes, build-and-test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build API Docker image
        run: |
          docker build \
            -t $REGISTRY/$PROJECT_ID/monolenz-api-staging:$GITHUB_SHA \
            -f Dockerfile.api .

      - name: Push API Docker image
        run: docker push $REGISTRY/$PROJECT_ID/monolenz-api-staging:$GITHUB_SHA

      - name: Deploy API to Cloud Run (0% traffic)
        run: |
          gcloud run deploy monolenz-api-staging \
            --image $REGISTRY/$PROJECT_ID/monolenz-api-staging:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 3001 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --no-traffic \
            --tag candidate-$GITHUB_SHA \
            --set-env-vars="NODE_ENV=staging,PORT=3001" \
            --set-secrets="DATABASE_URL=DATABASE_URL_STAGING:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY_STAGING:latest,NEW_RELIC_LICENSE_KEY=NEW_RELIC_LICENSE_KEY:latest"

      - name: Get candidate URL
        id: get-url
        run: |
          CANDIDATE_URL=$(gcloud run services describe monolenz-api-staging \
            --platform managed \
            --region $REGION \
            --format 'value(status.traffic[0].url)' \
            --filter="status.traffic.tag=candidate-$GITHUB_SHA")
          echo "candidate_url=$CANDIDATE_URL" >> $GITHUB_OUTPUT

      - name: Health check API
        run: |
          echo "Testing candidate deployment: ${{ steps.get-url.outputs.candidate_url }}"
          for i in {1..30}; do
            if curl -f "${{ steps.get-url.outputs.candidate_url }}/health" 2>/dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "Health check failed after 5 minutes"
          exit 1

      - name: Switch traffic to new revision
        run: |
          gcloud run services update-traffic monolenz-api-staging \
            --platform managed \
            --region $REGION \
            --to-tags candidate-$GITHUB_SHA=100

      - name: Clean up old revisions
        run: |
          # Keep only the latest 2 revisions for staging
          gcloud run revisions list \
            --service monolenz-api-staging \
            --platform managed \
            --region $REGION \
            --filter="NOT traffic.percent:0" \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)" \
            --limit=10 | tail -n +3 | while read revision; do
              if [ ! -z "$revision" ]; then
                echo "Deleting old revision: $revision"
                gcloud run revisions delete $revision \
                  --platform managed \
                  --region $REGION \
                  --quiet
              fi
            done

  notify:
    needs: [deploy-web, deploy-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-web.result }}" = "success" ] && [ "${{ needs.deploy-api.result }}" = "success" ]; then
            echo "✅ Staging deployment successful!"
          else
            echo "❌ Staging deployment failed!"
            exit 1
          fi
